[project]
name = "mat-vs-py-bench"
version = "0.1.0"
description = "MATLAB/Psychtoolbox vs Python/PsychoPy stimulus timing comparison"
# 3.11 only: psychopy needs <3.13 and its Windows dep pyWinhook ships wheels
# only up to cp311 (newer Pythons try a SWIG source build and fail).
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "psychopy>=2024.1",
]

[project.optional-dependencies]
# Windows rig only. NI-DAQmx driver must be installed separately.
rig = ["nidaqmx>=1.0"]
# For analyze.py
plot = ["matplotlib>=3.8"]

[tool.uv]
package = false
